spring:
  flyway:
    # local 에서만 db/seed 를 추가로 읽는다.
    # → 같은 코드베이스인데 환경마다 적용되는 마이그레이션이 달라지는 상황을 관찰할 수 있다.
    #
    # 주의: 프로필 파일의 locations 는 application.yml 의 값을 "통째로 덮어쓴다".
    #       기본 프로필이 local 이므로 STEPS 7단계에서 Java 마이그레이션 경로를 추가할 때도
    #       application.yml 이 아니라 이 파일을 고쳐야 한다.
    locations: classpath:db/migration,classpath:db/callback,classpath:db/seed
    # 실습 중 DB 를 통째로 날리고 처음부터 다시 마이그레이션하려면 필요하다.
    # ./gradlew :flyway-migration:flywayClean 으로 실행. 운영에서는 절대 false 로 두지 말 것.
    clean-disabled: false

logging:
  level:
    org.hibernate.SQL: debug

spring:
  application:
    name: jvm-heap-loadtest
  # 이 모듈의 관심사는 힙이지 DB 가 아니다. JPA 는 루트 build.gradle 에서 딸려온 것이라 조용히 둔다.
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

server:
  tomcat:
    threads:
      max: 20            # 기본값 200 은 로컬에서 고갈시키기 어렵다. 20 이면 눈에 보인다.
      min-spare: 5
    accept-count: 100    # 스레드가 다 찼을 때 OS 큐에서 대기할 수 있는 연결 수
    connection-timeout: 20s
  # 부하 중 커넥션이 유지되는지 보기 위해 keep-alive 를 명시한다
  max-http-request-header-size: 8KB

management:
  endpoints:
    web:
      exposure:
        # heapdump 는 운영에서 절대 열어두면 안 된다. 힙 전체가 덤프되므로 토큰/비밀번호까지 나간다.
        # 여기서는 실습을 위해 연다.
        include: health,info,metrics,prometheus,threaddump,heapdump,env,loggers
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: jvm-heap-loadtest

logging:
  level:
    root: INFO
    com.exam.jvmheap: DEBUG
